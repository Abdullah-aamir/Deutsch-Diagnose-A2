<style>
  :root{
    --paper:#fbf9f4; --ink:#1f2630; --rule:#d9d2c4;
    --blue:#2f55a4; --blue-soft:#eaf0fb;
    --green:#1f7a4d; --amber:#9a6a12; --red:#b3331f;
    --muted:#6d6457;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'EB Garamond',Georgia,serif; font-size:19px; line-height:1.6;
    padding:calc(22px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
            calc(40px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    -webkit-text-size-adjust:100%;
  }
  .sheet{
    max-width:700px;margin:0 auto;background:#fff;border:1px solid var(--rule);border-radius:4px;
    box-shadow:0 1px 0 rgba(0,0,0,.04),0 18px 40px -28px rgba(0,0,0,.35);
    padding:30px 32px 34px;
  }
  h1{font-size:26px;margin:0;font-weight:600;line-height:1.25}
  h2{font-family:Inter,sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.08em;
     text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
  .lede{font-size:18px;color:#413a30;margin:12px 0 0}
  .meta{font-family:Inter,sans-serif;font-size:12.5px;color:var(--muted)}
  hr{border:none;border-top:1px solid var(--rule);margin:22px 0}
  [hidden]{display:none !important}

  button{
    font-family:Inter,sans-serif;font-size:14px;font-weight:500;
    border:1px solid var(--rule);background:#fff;color:var(--ink);
    padding:9px 16px;border-radius:999px;cursor:pointer;transition:background .14s,border-color .14s;
  }
  button:hover:not(:disabled){background:#f4f1ea;border-color:#c3baa8}
  button:disabled{opacity:.4;cursor:default}
  button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  button.primary:hover{background:#27478c;border-color:#27478c}
  button.small{font-size:12.5px;padding:6px 12px}

  .top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .count{font-family:Inter,sans-serif;font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
  .track{flex:1;height:6px;background:#eee8dc;border-radius:99px;overflow:hidden}
  .fill{display:block;height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .25s}
  .qtext{font-size:23px;line-height:1.5;margin:26px 0 6px}
  .blank{display:inline-block;min-width:92px;border-bottom:2px solid var(--blue)}
  .hintw{font-family:Inter,sans-serif;font-size:13px;color:var(--muted);margin-bottom:20px}
  .opts{display:grid;gap:9px;margin-bottom:20px}
  .opt{
    font-family:Inter,sans-serif;font-size:15.5px;text-align:left;padding:13px 15px;
    border-radius:8px;border:1px solid var(--rule);background:#fdfcf9;line-height:1.35;
  }
  .opt .k{display:inline-block;width:19px;color:var(--muted);font-size:12.5px;font-weight:600}
  .opt.sel{border-color:var(--blue);background:var(--blue-soft)}

  .big{font-size:40px;font-weight:600;line-height:1;font-family:Inter,sans-serif}
  .cat{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:11px 0;border-bottom:1px dotted var(--rule)}
  .cat .nm{font-size:18px}
  .cat .nm small{font-family:Inter,sans-serif;font-size:12px;color:var(--muted);display:block}
  .cat .sc{font-family:Inter,sans-serif;font-size:13px;font-weight:600;white-space:nowrap;align-self:center}
  .cat .bar{grid-column:1/-1;height:5px;background:#eee8dc;border-radius:99px;overflow:hidden}
  .cat .bar i{display:block;height:100%;border-radius:99px}
  .rusty .sc{color:var(--red)} .rusty .bar i{background:var(--red)}
  .shaky .sc{color:var(--amber)} .shaky .bar i{background:var(--amber)}
  .solid .sc{color:var(--green)} .solid .bar i{background:var(--green)}

  @media (max-width:620px){
    body{padding:12px 10px 34px;font-size:18px}
    .sheet{padding:20px 16px 24px}
    h1{font-size:22px} .qtext{font-size:20px}
  }
</style>
</head>
<body>
<div class="sheet">

<section id="start">
  <h1>Deutsch-Diagnose</h1>
  <p class="lede">100 Fragen zu der Grammatik, die zwischen A2 und B1 am ehesten einrostet. Am Ende siehst du, welche Bereiche sitzen und welche nicht. Mehr macht der Test nicht.</p>
  <hr>
  <p class="meta">16 Bereiche · etwa 20 Minuten · Rückmeldung erst am Ende</p>
  <p>
    <button class="primary" id="go">Test starten</button>
    <button id="resume" hidden>Fortsetzen</button>
  </p>
  <p class="meta" id="resumeInfo" hidden></p>
</section>

<section id="quiz" hidden>
  <div class="top">
    <span class="count" id="count"></span>
    <span class="track"><span class="fill" id="qfill"></span></span>
  </div>
  <div class="qtext" id="qtext"></div>
  <div class="hintw" id="qhint"></div>
  <div class="opts" id="opts"></div>
  <button class="small" id="prev">Zurück</button>
</section>

<section id="results" hidden>
  <h1>Dein Ergebnis</h1>
  <p class="lede" id="overall"></p>
  <h2>Nach Bereich, schwächster zuerst</h2>
  <div id="cats"></div>
  <hr>
  <button id="again">Noch einmal</button>
</section>

</div>

];

let answers = new Array(Q.length).fill(null);
let idx = 0;

/* Ein angefangener Durchgang überlebt das Schließen des Tabs.
   Fertige Durchgänge werden gelöscht, damit der Start sauber bleibt. */
const KEY = 'de-diagnose';
function save(){
  try { localStorage.setItem(KEY, JSON.stringify({ n: Q.length, answers, idx })); } catch(e){}
}
function clearSaved(){
  try { localStorage.removeItem(KEY); } catch(e){}
}
function loadSaved(){
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (!d || d.n !== Q.length || !Array.isArray(d.answers) || d.answers.length !== Q.length) return null;
    const done = d.answers.filter(a => a !== null).length;
    return (done > 0 && done < Q.length) ? d : null;
  } catch(e){ return null; }
}

function shuffle(a){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
function prepare(){ Q.forEach(q => { q.opts = shuffle(q.o); }); }

/* Fragen rotieren durch die Bereiche, damit gleiche Themen nicht hintereinander kommen. */
const ORDER = (() => {
  const groups = CATS.map(c => Q.map((q,i) => q.c === c.id ? i : -1).filter(i => i > -1));
  const out = [];
  for (let round = 0; out.length < Q.length; round++)
    groups.forEach(g => { if (g[round] !== undefined) out.push(g[round]); });
  return out;
})();

const $ = id => document.getElementById(id);
const cur = () => ORDER[idx];
const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function show(name){ ['start','quiz','results'].forEach(s => $(s).hidden = (s !== name)); window.scrollTo({top:0}); }

function renderQ(){
  const q = Q[cur()];
  $('count').textContent = 'Frage ' + (idx+1) + ' von ' + Q.length;
  $('qfill').style.width = ((idx+1)/Q.length*100) + '%';
  $('qtext').innerHTML = esc(q.s[0]) + '<span class="blank"></span>' + esc(q.s[1] || '');
  $('qhint').textContent = q.h || '';
  $('qhint').hidden = !q.h;

  const box = $('opts');
  box.innerHTML = '';
  q.opts.forEach((o,i) => {
    const b = document.createElement('button');
    b.className = 'opt' + (answers[cur()] === o ? ' sel' : '');
    b.innerHTML = '<span class="k">' + (i+1) + '</span>' + esc(o);
    b.addEventListener('click', () => choose(o));
    box.appendChild(b);
  });
  $('prev').disabled = idx === 0;
}

function choose(o){
  answers[cur()] = o;
  save();
  renderQ();
  setTimeout(() => {
    if (idx < Q.length - 1){ idx++; save(); renderQ(); } else showResults();
  }, 160);
}

function showResults(){
  clearSaved();
  const right = answers.filter((a,i) => a === Q[i].a).length;
  $('overall').innerHTML = '<span class="big">' + right + '</span> <span class="meta">von ' + Q.length + ' richtig</span>';

  const rows = CATS.map(c => {
    const items = Q.map((q,i) => ({q,i})).filter(x => x.q.c === c.id);
    const r = items.filter(x => answers[x.i] === x.q.a).length;
    const pct = Math.round(r / items.length * 100);
    return { c, r, total: items.length, pct, band: pct >= 80 ? 'solid' : (pct >= 60 ? 'shaky' : 'rusty') };
  }).sort((a,b) => a.pct - b.pct);

  const label = { rusty:'eingerostet', shaky:'wackelig', solid:'sitzt' };
  $('cats').innerHTML = rows.map(e =>
    '<div class="cat ' + e.band + '">' +
      '<div class="nm">' + esc(e.c.de) + '<small>' + esc(e.c.en) + ' · ' + label[e.band] + '</small></div>' +
      '<div class="sc">' + e.r + '/' + e.total + '</div>' +
      '<div class="bar"><i style="width:' + e.pct + '%"></i></div>' +
    '</div>'
  ).join('');

  show('results');
}

function start(){
  answers = new Array(Q.length).fill(null);
  idx = 0;
  clearSaved();
  prepare();
  show('quiz');
  renderQ();
}

function offerResume(){
  const d = loadSaved();
  $('resume').hidden = !d;
  $('resumeInfo').hidden = !d;
  if (d){
    $('resumeInfo').textContent = d.answers.filter(a => a !== null).length +
      ' von ' + Q.length + ' Fragen sind schon beantwortet.';
    $('go').textContent = 'Neu starten';
  } else {
    $('go').textContent = 'Test starten';
  }
}

$('go').addEventListener('click', start);
$('again').addEventListener('click', start);
$('prev').addEventListener('click', () => { if (idx > 0){ idx--; save(); renderQ(); } });
$('resume').addEventListener('click', () => {
  const d = loadSaved();
  if (!d){ start(); return; }
  answers = d.answers;
  idx = Math.min(d.idx || 0, Q.length - 1);
  show('quiz');
  renderQ();
});

prepare();
offerResume();
show('start');

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
